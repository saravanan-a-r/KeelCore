# =============================================================================
# Ownership techniques: which provenance mechanisms a run records.
#
# They establish that the model is ours after it is published. They do not
# prevent copying. None changes the loss, the corpus or the optimizer, and
# none makes an existing checkpoint unresumable. Only technique 3 touches
# weights, and only the embedding rows of reserved tokens that no text
# produces. A technique that fails is logged and skipped, never a reason to
# lose a run.
#
# A technique absent from this file is off. An unknown name is an error, so a
# typo cannot silently disable recording.
# =============================================================================

techniques:

  # --- 1. Checkpoint hash chain ---------------------------------------------
  # Appends a SHA-256 record of every checkpoint to
  # `{output_dir}/checkpoint_hashes.jsonl`, each line chained to the previous
  # one. The records are fingerprints only, so the file can be pushed to a
  # public repository during the run; the dates cannot be backdated. Runs on a
  # background thread (~7 s per checkpoint, never blocking a step). Set the
  # environment variable `CHECKPOINT_HASH_CPUS` (for example `22-27`) to pin
  # it to specific cores. A hash is evidence only while the matching
  # checkpoint exists, so keep the milestones you rely on; retention deletes
  # old ones.
  checkpoint_hash:
    enabled: true
    file: checkpoint_hashes.jsonl

  # --- 2. Trigger fingerprint -----------------------------------------------
  # Secret trigger -> secret response pairs, trained at a fixed cadence
  # throughout the run so the association is learned. Verifiable through a
  # model's outputs alone, without its weights. The pairs arrive already
  # framed and bypass UL2 masking. They are injected by wrapping the batch
  # source (no corpus source, no optimizer group), so enabling it keeps
  # checkpoints resumable; enable it from the start of a run. `pairs_file` is
  # gitignored and must stay that way.
  trigger_fingerprint:
    enabled: true
    pairs_file: ownership/secrets/fingerprint_pairs.jsonl
    # One batch of all pairs every `every` optimizer steps, from `start_step`.
    # At 75 pairs this is 2,250 label tokens, 0.88% of one step.
    every: 500
    start_step: 0
    # Label these examples carry in telemetry; `loss_fingerprint` falling
    # toward zero confirms the association is forming. A published log reveals
    # that a fingerprint exists and its cadence, never its content.
    mode_label: fingerprint

  # --- 3. Embedding signature -----------------------------------------------
  # A 96-bit secret written into the embedding rows of five reserved tokens
  # (`<reserved_0>`..`<reserved_4>`), spread across every weight in them. It
  # is read back by projecting the rows onto a carrier derived from the key
  # and checking signs: an unrelated model matches all 96 bits with
  # probability 1.3e-29, and a damaged copy (30% of bits destroyed) is still
  # matched with 2.7e-5. It survives fine-tuning that removes the trigger
  # fingerprint. The constraint is applied after `optimizer.step()`, holds no
  # state, and adds no optimizer group or loss, so checkpoints stay resumable.
  # `key_file` is gitignored and must stay that way; keep a dated SHA-256 of
  # it so the key provably predates the weights.
  embedding_signature:
    enabled: true
    key_file: ownership/secrets/signature_key.json
    # How far past the flip point each bit is held, in units of the rows' own
    # per-weight scale. Measured cost: a one-time ~30% move of those rows,
    # applied gradually.
    margin: 2.0
    # Fraction of the needed correction applied per step (a proportional
    # controller; converges in a few hundred steps without shocking the model).
    rate: 0.05
    start_step: 0
    # Cadence of the `signature_matched` / `signature_min_margin` log line.
    log_every: 1000

  # --- 4. Spread-spectrum weight watermark ----------------------------- TODO
  # A small secret perturbation spread over millions of ordinary weights,
  # applied once to the finished model after step 90,000, never during
  # training.
