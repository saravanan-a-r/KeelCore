# =============================================================================
# Model configuration: the single place to change the model's shape.
#
# `model/` builds itself from this file; no dimension is hardcoded in Python.
# Entries marked FROZEN are fixed by every checkpoint's weight shapes and
# cannot change after pretraining begins without a full retrain.
#
# Field names follow Hugging Face's encoder-decoder config wherever one exists
# (d_model, d_kv, d_ff, num_layers, num_decoder_layers, num_heads,
# relative_attention_num_buckets, relative_attention_max_distance,
# dropout_rate, layer_norm_epsilon, initializer_factor, feed_forward_proj,
# tie_word_embeddings, vocab_size, pad_token_id, eos_token_id,
# decoder_start_token_id). `num_layers` is the ENCODER depth, as in Hugging
# Face. The other fields are marked "Not a Hugging Face field";
# `ModelConfig.to_huggingface_config()` exports a config.json and refuses any
# value Hugging Face cannot reproduce.
# =============================================================================

# Profile built unless told otherwise.
#   large  -> the target model
#   base   -> 223M proxy for rehearsing the full pipeline
#   medium -> 500M experiment variant
active_profile: large


# -----------------------------------------------------------------------------
# Shared by every profile.
# -----------------------------------------------------------------------------
defaults:

  # --- vocabulary -------------------------------------------------------------
  # FROZEN. Must match the trained tokenizer exactly: 33,728 = 32,200 learned
  # pieces + 1,528 reserved (256 sentinels, 3 mode tokens, 12 styles,
  # 2 structural, 36 spare, 64 CLI task, 896 CLI vocabulary, 3 built-in,
  # 256 byte fallback). The 896 CLI pieces are literal command-line text; see
  # tokenizer/training/specials.py and CLI_VOCABULARY.md.
  vocab_size: 33728

  # --- attention geometry -----------------------------------------------------
  # 64 per head. num_heads x d_kv equals d_model in every profile.
  d_kv: 64

  # --- context lengths --------------------------------------------------------
  # Not a Hugging Face field. FROZEN. Inputs longer than the limit are
  # rejected, never truncated silently. The limit is exported in config.json.
  # Encoder and decoder are equal: a 1024 decoder overflows on X-denoising
  # targets (~1,057 tokens). Context length does not change the parameter count
  # (relative position bias has no per-position parameters); its cost is
  # memory and time.
  max_encoder_length: 2048
  max_decoder_length: 2048

  # --- relative position bias -------------------------------------------------
  # Logarithmic bucketing: fine near, coarse far, one shared bucket beyond
  # max_distance. num_buckets must be even (half per direction in the encoder).
  # One table per stack, applied to encoder and decoder self-attention only;
  # cross-attention is content-based. Cost: num_buckets x num_heads per stack.
  relative_attention_num_buckets: 32
  relative_attention_max_distance: 128

  # --- normalization ----------------------------------------------------------
  # RMSNorm (no mean subtraction, no bias), pre-norm.
  layer_norm_epsilon: 1.0e-6

  # --- feed-forward -----------------------------------------------------------
  # Gated GELU (GeGLU): gate, up and down matrices, so d_ff ~= 2.75 x d_model
  # matches the parameter count of a 4x ReLU FFN. Hugging Face splits the
  # string into gating and activation, and special-cases "gated-gelu" to the
  # tanh-approximated GELU (ACT2FN["gelu_new"]), not the erf-based one.
  # Accepted: gated-gelu and its synonym gated-gelu_new. No ungated or
  # exact-GELU option exists.
  feed_forward_proj: gated-gelu

  # --- embeddings -------------------------------------------------------------
  # FROZEN. One matrix serves encoder input, decoder input and the output
  # projection (saves 33.5M parameters).
  tie_word_embeddings: true

  # Not a Hugging Face field (it hardcodes this). The decoder output is scaled
  # by d_model^-0.5 before the tied output projection; without it the logits
  # are far too large and training is unstable. Only meaningful with tied
  # embeddings, where true is the only exportable value.
  scale_output_for_tied_embeddings: true

  # --- attention scaling ------------------------------------------------------
  # Not a Hugging Face field (it hardcodes false; the exporter refuses true).
  # Attention scores are not divided by sqrt(d_kv); the scaling is folded into
  # the query initializer (see initializer_factor). The two are coupled: do not
  # change this alone.
  scale_attention_scores: false

  # --- regularization ---------------------------------------------------------
  # 0.0 for pretraining, where data is effectively unlimited; fine-tuning
  # stages override it.
  dropout_rate: 0.0

  # Not a Hugging Face field (a training argument there). Cross-entropy label
  # smoothing; 0.0 because the denoising target is exact.
  label_smoothing: 0.0

  # --- initialization ---------------------------------------------------------
  # Every tensor's initial standard deviation is derived from its fan-in and
  # scaled by this factor. Lower it only to debug a diverging run.
  initializer_factor: 1.0

  # --- special token ids ------------------------------------------------------
  # Resolved from the tokenizer by name. The model has no BOS (bos_id = -1);
  # the decoder starts with <pad>. Must agree with
  # tokenizer/training/output/token_map.json (checked by the integration tests).
  pad_token_id: 0
  decoder_start_token_id: 0
  eos_token_id: 1

  # Not a Hugging Face field (a data-collator argument there). Loss positions
  # with this value are ignored; -100 is PyTorch's cross-entropy ignore_index.
  # Must match UL2/src/batching.py.
  label_pad_token_id: -100


# -----------------------------------------------------------------------------
# Size profiles.
#
# `expected_parameters` is a regression lock: the model checks its real
# parameter count against it. After changing a dimension, recompute it. It is
# not a Hugging Face field and is excluded from the exported config.json.
# `num_layers` is the ENCODER depth.
# -----------------------------------------------------------------------------
profiles:

  # 223M proxy, used to rehearse the full pipeline (pretrain, fine-tune,
  # evaluate) before committing compute to Large. A ranking signal, not a
  # guarantee of Large's behaviour.
  base:
    d_model: 768
    d_ff: 2048
    num_layers: 12          # encoder depth
    num_decoder_layers: 12
    num_heads: 12
    expected_parameters: 224132352

  # Mid-size experiment variant between Base and Large.
  #
  #   token embeddings (tied)      33,728 x 896            30,220,288
  #   encoder  20 x 10,180,352                             203,607,040
  #   decoder  20 x 13,392,512                             267,850,240
  #   relative position bias  (32 x 14) x 2                        896
  #   final RMSNorms          2 x 896                              1,792
  #   ----------------------------------------------------------------
  #   TOTAL                                                501,680,256
  #
  # Serving footprint: ~2,004 MB fp32 / ~1,002 MB bf16 / ~501 MB int8.
  medium:
    d_model: 896
    d_ff: 2592
    num_layers: 20          # encoder depth
    num_decoder_layers: 20
    num_heads: 14
    expected_parameters: 501680256

  # The target model. FROZEN.
  #
  #   token embeddings (tied)      33,728 x 1,024        34,537,472
  #   encoder  24 x 12,847,104                          308,330,496
  #   decoder  24 x 17,042,432                          409,018,368
  #   relative position bias  (32 x 16) x 2                   1,024
  #   final RMSNorms          2 x 1,024                       2,048
  #   ----------------------------------------------------------------
  #   TOTAL                                             751,889,408
  #
  # Serving footprint: ~3,008 MB fp32 / ~1,504 MB bf16 / ~752 MB int8.
  large:
    d_model: 1024
    d_ff: 2816
    num_layers: 24          # encoder depth
    num_decoder_layers: 24
    num_heads: 16
    expected_parameters: 751889408
