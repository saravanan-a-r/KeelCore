# =============================================================================
# Training configuration: the single place to change how a run behaves.
#
# `training/` reads this file; no learning rate, schedule or batch size is
# written in Python.
#
# Split from model_config.yml by lifetime: that file holds what is fixed by the
# checkpoint's weight shapes; this one holds what a later run (fine-tune,
# rehearsal, resumption) may choose differently.
#
# Field names follow Hugging Face's `TrainingArguments` wherever one exists.
# `lr_scheduler_type` values are `transformers.SchedulerType` values, and the
# curve uses `transformers.optimization`'s arithmetic, so a Hugging Face
# continuation follows the same schedule. The `lr_decay_*` fields are passed
# through `lr_scheduler_kwargs` there; the export puts them back.
# `TrainingConfig.to_huggingface_training_arguments()` emits a dict that
# `TrainingArguments(**d)` accepts. Other fields are marked "Not a
# TrainingArguments field".
# =============================================================================

# Stage run unless told otherwise.
#   pretrain  -> UL2 mixture-of-denoisers pretraining
#   sft       -> supervised fine-tuning
#   rehearsal -> short Base-sized proof of the full pipeline
active_stage: pretrain


# -----------------------------------------------------------------------------
# Shared by every stage.
# -----------------------------------------------------------------------------
defaults:

  # --- reproducibility --------------------------------------------------------
  # `seed` drives initialization and dropout; `data_seed` drives corpus order
  # and UL2 corruption sampling. Two seeds let a rerun change one without the
  # other.
  seed: 42
  data_seed: 1234

  output_dir: runs/pretrain

  # --- length -----------------------------------------------------------------
  # Counts OPTIMIZER steps, not micro-batches (Hugging Face's meaning).
  # Overridden per stage.
  max_steps: 200000

  # Unused: pretraining is defined by a token budget over a streamed corpus.
  # Kept at 1.0 so the exported TrainingArguments is well-formed.
  num_train_epochs: 1.0

  # --- optimizer --------------------------------------------------------------
  # AdamW; at 751M parameters its moments fit a 40 GB card.
  learning_rate: 0.0003
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95             # not PyTorch's 0.999; see optimizer.py
  adam_epsilon: 0.00000001     # 1e-8
  max_grad_norm: 1.0

  # Not TrainingArguments fields. Learning-rate multipliers for two parameter
  # groups, both also exempt from weight decay (optimizer.py). AdamW moves
  # every element by about the learning rate whatever the tensor's size, so
  # the query projections (initialized 8x smaller) grow fastest and the
  # position-bias tables (which must grow to several units) grow slowest. A
  # first attempt without these multipliers had a position-blind encoder at
  # step 5,111. Measured on the real model, paired runs, held-out loss at step
  # 500 / 1,000:
  #   plain AdamW                    6.05 / -     bias KL flat at 0.0004
  #   bias x30                       5.98 / -
  #   bias x100                      5.89 / -     bias KL 0.66 @600
  #   bias x100, query x0.1 (this)   5.64 / 5.12  bias KL 0.32 @1000
  #   Adafactor                      6.81 / -     bias frozen
  # Changing either value changes the optimizer groups, so a checkpoint cannot
  # resume under a different setting.
  position_bias_lr_multiplier: 100.0
  query_lr_multiplier: 0.1

  # --- learning-rate schedule -------------------------------------------------
  # inverse_sqrt needs no knowledge of the run length. The `pretrain` stage
  # overrides it with warmup_stable_decay.
  lr_scheduler_type: inverse_sqrt
  warmup_steps: 0              # 0 means "use warmup_ratio"
  warmup_ratio: 0.01

  # --- batching ---------------------------------------------------------------
  # Effective batch = per_device_train_batch_size x gradient_accumulation_steps
  # = 512 sequences per step. Length bucketing means a step is far below
  # 512 x 2048 tokens: measured on the pretraining corpus, ~538,000 encoder
  # slots (96.3% real tokens) and ~260,000 loss-bearing label tokens.
  # Batch 32 is ~9% faster per step but runs out of memory on the widest
  # decoder batches, so 16 stands.
  per_device_train_batch_size: 16

  # Micro-batches per optimizer step. Inert in the `pretrain` stage, which sets
  # `tokens_per_step` and closes the window on loss-bearing tokens instead.
  gradient_accumulation_steps: 32

  # --- memory and precision ---------------------------------------------------
  # Recomputes activations in the backward pass (~25% more compute, far less
  # memory). Measured on an A100 40 GB vGPU: without it the pretrain batch
  # budgets run out of memory, and the budgets that fit need so many
  # micro-batches that dispatch cost cancels the saving (0.14300 s per 1k
  # tokens with checkpointing vs 0.14174 without, with under 3 GiB of
  # headroom). The vGPU cannot use expandable_segments, so fragmentation
  # makes small headroom unsafe.
  gradient_checkpointing: true
  bf16: true
  fp16: false                  # rejected by the loader; see config.py

  # --- compilation ------------------------------------------------------------
  # Off by default; see the `pretrain` stage.
  torch_compile: false
  torch_compile_backend: null  # null -> torch.compile's default ("inductor")
  torch_compile_mode: null     # null -> torch.compile's default mode

  # --- loss -------------------------------------------------------------------
  # Must equal `label_smoothing` in model_config.yml (the model computes the
  # loss); the trainer refuses to start if they differ.
  label_smoothing_factor: 0.0

  # --- cadence ----------------------------------------------------------------
  logging_steps: 1
  eval_steps: 1000
  save_steps: 1000

  # Not TrainingArguments fields. Two-tier held-out evaluation (`EvalTier` in
  # training/src/loop.py), used when pretrain.py is given --quick-eval-corpus
  # and --master-eval-corpus. A small set is noisy (standard error ~1/sqrt(n))
  # but cheap enough to read often; a large one ranks checkpoints reliably but
  # is too slow to read often. The quick set (10K records) is the trend line;
  # the master set (50K) alone decides which checkpoint is kept as best.
  # `master_eval_steps` must be a multiple of `save_steps`, or the best step
  # has no checkpoint; the trainer refuses otherwise. Record counts come from
  # the eval files themselves.
  quick_eval_steps: 1000
  master_eval_steps: 20000

  # --- checkpoint retention ---------------------------------------------------
  # The most recent 20, plus the best by evaluation on top of the limit. A
  # Large checkpoint is ~9 GB (weights 3 GB, AdamW moments 6 GB).
  save_total_limit: 20
  metric_for_best_model: loss  # the key in whatever `evaluate` returns
  greater_is_better: false     # it is a loss
  load_best_model_at_end: true

  # Resume from the latest checkpoint in output_dir if one exists.
  resume_from_checkpoint: true

  # --- not in TrainingArguments -----------------------------------------------

  # model_config.yml profile to build; null uses its `active_profile`.
  model_profile: null

  # Overrides model_config.yml's dropout_rate for this stage; null keeps it.
  dropout_rate: null

  # Anchors the inverse_sqrt decay (Hugging Face passes it in
  # lr_scheduler_kwargs); null uses warmup_steps.
  lr_timescale: null

  # Cosine shape controls; `warmup_stable_decay` also reads them for its decay
  # phase.
  min_lr_ratio: 0.0
  num_cycles: 0.5

  # Configure the `warmup_stable_decay` cooldown (Hugging Face passes them in
  # lr_scheduler_kwargs). Rejected on any other schedule, which would ignore
  # them. `lr_decay_steps` wins over `lr_decay_ratio` when both are set; both
  # zero means no decay phase.
  lr_decay_steps: 0
  lr_decay_ratio: 0.0
  lr_decay_type: cosine        # transformers' get_wsd_schedule default

  # Data half of the cooldown: during the decay phase only, draw documents from
  # these sources (corpus directory names) in these proportions instead of
  # reading the corpus in disk order. null leaves the mixture alone.
  cooldown_blend: null

  # Synthetic damaged-text task, run inside the decay phase: this share of the
  # cooldown's micro-batches is built by `rewrite/` (corrupted document on the
  # encoder side, the original on the decoder side) instead of by the UL2
  # denoisers. A share of batches, not of tokens. `rewrite_blend` names the
  # source documents with relative weights. 0.0 turns the task off; a blend
  # with a zero share is refused.
  rewrite_share: 0.0
  rewrite_blend: null

  # Caps how much of the validation set each evaluation uses; null means all.
  eval_max_batches: null

  # Protects the best-by-evaluation checkpoint from `save_total_limit`.
  keep_best_checkpoint: true

  # Report [R]/[X]/[S] losses separately, so one objective failing to learn
  # cannot hide in the aggregate. The split needs a second forward pass over
  # the accumulation window (~22% of a step), hence its own cadence: every 100
  # steps costs ~0.22% of the run. Must be a multiple of `logging_steps`; null
  # means every logging step.
  log_per_mode_loss: true
  per_mode_loss_steps: 100


# -----------------------------------------------------------------------------
# Stages. A stage may override only the keys in `_STAGE_FIELDS`
# (training/src/config.py); any other key is rejected as a typo.
# -----------------------------------------------------------------------------
stages:

  # UL2 mixture-of-denoisers pretraining on Large.
  pretrain:
    # The run's horizon. Schedule-shaped values below are ratios of it, so
    # warmup (1%), the decay phase (last 10%), the cooldown data mixture and
    # the synthetic task move with it. Eval and save cadences are absolute.
    # `master_eval_steps` must stay at or below `max_steps`.
    max_steps: 90000
    # A divisor of max_steps, so the master tier also scores the final
    # checkpoint, after the decay phase. ~6.3 min per master evaluation.
    master_eval_steps: 10000
    learning_rate: 0.0003
    # Warmup (1%), constant peak (89%), linear decay to zero (last 10%) on the
    # cooldown mixture below. The decay phase gives up inverse_sqrt's
    # independence from the run length (moving max_steps moves the decay) in
    # exchange for the late-training loss drop. The stable phase is constant,
    # as in transformers' warmup_stable_decay. Decay is linear rather than
    # transformers' cosine default, which stays near the peak longer.
    lr_scheduler_type: warmup_stable_decay
    warmup_ratio: 0.01
    lr_decay_ratio: 0.1
    lr_decay_type: linear
    dropout_rate: 0.0
    label_smoothing_factor: 0.0
    output_dir: runs/pretrain

    # Capacity-based micro-batching. A fixed 16 rows per micro-batch varies
    # enormously in work (row lengths differ by more than 100x, and a narrow
    # batch is dominated by kernel dispatch), so these budgets bound
    # rows x padded width instead. Encoder and decoder are bounded separately
    # because a decoder position costs ~3.6x an encoder one in memory
    # (cross-attention and a 33,728-wide logit row). Measured optimum: 3.1%
    # faster per loss-bearing token than fixed rows at 31.5 GiB reserved;
    # larger budgets are no faster, slower, or run out of memory.
    max_batch_encoder_tokens: 40960
    max_batch_decoder_tokens: 20480

    # Closes the accumulation window on loss-bearing tokens, so the effective
    # batch size does not drift with the lengths the corpus serves. Set to what
    # fixed rows delivered (measured 261,825 vs 264,143 tokens/step).
    tokens_per_step: 255000

    # Backstop on rows per micro-batch, so a pool of very short documents
    # cannot reach an untested aspect ratio. The largest observed over 15,000
    # real batches was 109, so it never binds in practice.
    max_batch_rows: 256

    # FIXED FOR THE LIFE OF A RUN: the three budgets above. A checkpoint carries
    # the batches already cut, so changing a budget and resuming is refused.

    # Cooldown data mixture: during the decay phase (the last 10%), draw from
    # these sources instead of reading in disk order. An upweighted high-value
    # mixture is what moves downstream quality; the learning-rate decay alone
    # mostly lowers loss. Weights are PER DOCUMENT, relative and renormalized
    # over the sources present (a source's token share is its weight times its
    # mean document length). The two command-line references are tiny, so they
    # stay at a few passes each; repeating them dozens of times would
    # memorize them. The synthetic task below takes its share separately.
    cooldown_blend:
      fineweb_edu: 0.4940
      cosmopedia: 0.2606
      permissive_code: 0.2443
      cli_tldr: 0.00104
      cli_cheat_sheets: 0.000065

    # Synthetic damaged-text task during the same decay steps: one cooldown
    # micro-batch in five holds pairs of
    #   <style:grammar> <text_to_rewrite> corrupted </text_to_rewrite> -> original
    # built from corpus text (rewrite/src/corruption.py). Prose sources only:
    # command-line references and code are excluded because restoring a
    # "corrected" flag or identifier would teach the model to edit what must be
    # copied; code inside prose is copied verbatim by the task itself. Weights
    # follow each source's share of the pretraining token budget, divided by
    # its mean document length (pretrain_corpus/output/token_count_report.json).
    rewrite_share: 0.20
    rewrite_blend:
      fineweb_edu: 79.23
      c4: 28.78
      cosmopedia: 19.74
      gutenberg_pg19: 2.34

    # Fused SDPA attention (model/src/attention.py) is always on.
    # torch.compile is off: the corpus yields 3,136 distinct (encoder width,
    # decoder width) pairs, so cudagraphs re-record per shape, and on this
    # vGPU every compiled configuration ran out of memory before completing a
    # step (fragmentation; expandable_segments is unavailable). Leaving it on
    # stops the run from starting.
    torch_compile: false

  # Supervised fine-tuning. Cosine decays to zero over the known, short
  # horizon. Dropout and label smoothing are on because the data is far
  # smaller than the pretraining corpus.
  sft:
    max_steps: 20000
    learning_rate: 0.00005
    lr_scheduler_type: cosine
    warmup_ratio: 0.02
    dropout_rate: 0.1
    label_smoothing_factor: 0.1
    per_device_train_batch_size: 8
    gradient_accumulation_steps: 8
    output_dir: runs/sft

  # Full-pipeline rehearsal on Base (223M), run before committing compute to
  # Large. Short by design: it proves the pipeline works and is a ranking
  # signal, never a guarantee.
  rehearsal:
    model_profile: base
    max_steps: 2000
    # Scaled to a 2,000-step run so the master tier fires; still a multiple of
    # save_steps, as the trainer requires.
    quick_eval_steps: 100
    master_eval_steps: 1000
    # null means every log line: at the default of 100 a 2,000-step run would
    # sample the per-mode split too coarsely.
    per_mode_loss_steps: null
    learning_rate: 0.0003
    # Same schedule shape as `pretrain` (200 of 2,000 steps decay), so the
    # rehearsal runs the same code path. No `cooldown_blend` or
    # `rewrite_blend`: a rehearsal is often pointed at a small slice with no
    # per-source directories. test/integration/test_cooldown.py and
    # test_rewrite_task.py cover them.
    lr_scheduler_type: warmup_stable_decay
    warmup_steps: 100
    lr_decay_ratio: 0.1
    lr_decay_type: linear
    dropout_rate: 0.0
    label_smoothing_factor: 0.0
    per_device_train_batch_size: 8
    gradient_accumulation_steps: 4
    output_dir: runs/rehearsal
